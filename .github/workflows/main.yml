name: Silver Bot Daily Run
on:
  schedule:
    - cron: '17 2 * * *' # Runs at 1:30 AM UTC (7:00 AM IST)
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v5 # Using the latest 2026 version
        with:
          python-version: '3.9'
          cache: 'pip' # <--- THIS IS THE MAGIC LINE
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bot
        env:
          # This connects your GitHub Secrets to the Python script
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python silver_bot.py
